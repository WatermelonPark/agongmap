# GitHub Pages(Jekyll) 빌드 설정. 사이트는 손으로 쓴 정적 파일과 생성기 산출물이라
# Jekyll 기능은 쓰지 않고, 공개 페이지가 아닌 저장소 전용 폴더·파일만 배포에서 뺀다.
# 저장소는 공개라 내용이 비밀은 아니지만, 사이트 주소로 색인되거나(README.md가
# /docs/ 목차가 되는 등) 방문자에게 노출될 이유가 없다(2026-09-23).
# ⚠️ 사이트가 실제로 불러오는 파일(루트 *.js·*.json, share/, icons/ 등)은 넣지 않는다.
exclude:
  - docs/
  - tools/
  - art_raw/
  - CLAUDE.md
