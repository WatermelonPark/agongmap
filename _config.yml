# GitHub Pages(Jekyll) 빌드 설정. 사이트는 손으로 쓴 정적 파일과 생성기 산출물이라
# Jekyll 기능은 쓰지 않고, 공개 페이지가 아닌 저장소 전용 폴더·파일만 배포에서 뺀다.
# 저장소는 공개라 내용이 비밀은 아니지만, 사이트 주소로 색인되거나(README.md가
# /docs/ 목차가 되는 등) 방문자에게 노출될 이유가 없다(2026-09-23).
# ⚠️ 사이트가 실제로 불러오는 파일(루트 *.js·*.json, share/, icons/ 등)은 넣지 않는다.
exclude:
  - docs/
  - tools/
  - art_raw/
  - CLAUDE.md
  # 글 원고(프런트매터가 든 md). 빼지 않으면 Jekyll 이 /content/<섹션>/<slug>.html 로 변환해 내보낸다 — 자리표({{v:…}})가
  # Liquid 에 지워져 숫자가 빠진 문장, canonical 은 자기 자신인 중복 페이지가 색인 가능한 채 떴다(2026-11-13 전수 리뷰).
  # ⚠️ content/ 를 통째로 빼면 안 된다: 글 페이지가 /content/<섹션>/img/ 그림을 직접 불러온다(test_pages_config).
  - content/README.md
  - content/*/*.md
