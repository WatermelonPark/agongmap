<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"></noscript>
<title>페이지를 찾을 수 없습니다 — 아공맵</title>
<meta name="robots" content="noindex, max-image-preview:large">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/app_icon.png">
<style>@font-face{font-family:'Agong Fallback';src:local('Noto Sans CJK KR'),local('NotoSansCJKkr-Regular'),local('Noto Sans KR'),local('NotoSansKR-Regular');size-adjust:94%;ascent-override:101%;descent-override:26.4%;line-gap-override:0%;unicode-range:U+1100-11FF,U+3130-318F,U+AC00-D7A3}
b,strong{font-weight:600}
  :root{--brand:#16325c;--brand-bg:#e8eef7;--mark:#ffe066;--mark-bg:#fff3b8;--mark-soft:#fff6cc;--mark-ink:#5a4300;--ink:#131e24;--ink2:#4c5f66;--paper:#f4f6f5;--muted:#5e6f74;--line:#c4cec9;--jeonse:#6c4ab6;--stock:#1f8a70}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);min-height:100vh;
    font-family:'Pretendard Variable','Pretendard','Agong Fallback',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;word-break:keep-all;-webkit-font-smoothing:antialiased}
  .wrap{max-width:440px;text-align:center;position:relative}
  .inner{position:relative;z-index:1}
  .code{font-size:72px;font-weight:600;letter-spacing:-.03em;color:var(--ink);line-height:1;margin-bottom:8px}
  /* 머리 칩 — 다른 손 페이지(소개·FAQ·개인정보·퀴즈)와 같은 먹색 칩(2026-11-07 디자인 검수 hand-4, 예전엔 회색 글자 라벨) */
  .chip{display:inline-block;font-size:13px;font-weight:600;color:#fff;
    background:var(--brand);padding:6px 16px;border-radius:0;margin-bottom:18px}
  h1{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin-bottom:14px}
  p{font-size:15px;color:var(--ink2);line-height:1.6;margin-bottom:28px}
  p a{color:var(--ink);font-weight:600}
  /* 그림자 없는 먹색 채움 — 주 CTA 어휘(홈 .home-cta·.tb-more)와 통일.
     장식 그림자는 원부 정리 때 걷은 것의 잔재였다(2026-08-14 검수). */
  .cta{display:block;width:100%;max-width:400px;margin:30px auto 10px;text-align:center;text-decoration:none;
    background:var(--brand);color:#fff;font-size:17px;font-weight:600;padding:16px 24px;border-radius:3px}
  /* 되돌아가기 — 주소 오타로 온 독자에게 가장 빠른 복구(hand-4). 퀴즈 랜딩의 보조 단추(.cta.sub)와 같은 값. 스크립트가 돌고
     뒤로 갈 곳이 있을 때만 보인다(hidden 을 스크립트가 뗀다). */
  .cta.sub{background:#fff;color:var(--ink);border:1.5px solid var(--ink);margin-top:12px;font-family:inherit;cursor:pointer}
  .cta[hidden]{display:none}
  /* 공용 푸터(site_nav.HAND_FOOTER) — 가운데 정렬 한 단 아래에 둔다 */
  body{flex-direction:column}
  footer.sfoot{margin-top:36px;max-width:440px;text-align:center;font-size:13px;line-height:1.7;color:var(--muted)}
  footer.sfoot a{color:var(--muted)}

/* 하단 네비 — 이 페이지는 공용 스타일시트를 안 쓰므로 필요한 규칙만 동봉
   (2026-08-14 검수: 페이지마다 네비 유무가 달라 막다른 페이지가 생겼다).
   활성 탭 없음 — 문서 페이지는 네 탭 어디에도 속하지 않는다.
   ⚠️ 주석에도 공용 시트의 파일명을 쓰지 말 것 — audit_design의 공유 판정이
   문자열 검색이라 주석의 파일명만으로 그 시트의 그림자까지 합산된다. */
body{padding-bottom:66px}
.bottomnav{position:fixed;bottom:0;left:0;right:0;height:62px;background:var(--brand);
  display:flex;justify-content:center;z-index:100;box-shadow:0 -4px 18px rgba(19,30,36,.28)}
.nav-btn{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:#97a0b8;font-size:13px;font-weight:600;
  text-decoration:none}
.nav-btn svg{display:block}
.nav-btn:focus-visible{outline:2px solid #fff;outline-offset:-4px}
@media(max-width:1023px){html{scroll-padding-bottom:72px}}
/* 건너뛰기 링크 — 다른 손 페이지(소개·FAQ·개인정보)와 같은 규칙 */
.skip{position:absolute;left:8px;top:-60px;z-index:100;padding:10px 14px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;text-decoration:none;border-radius:3px}
.skip:focus{top:8px;outline:2px solid #fff;outline-offset:2px}

:where(main) :where(p,li,dd,td)>a:not([class]){color:var(--brand);text-decoration:underline;text-underline-offset:2px}   /* 본문 링크는 남색 밑줄(2026-11-11 색 감사 — 링크가 본문과 같은 먹색이라 눌리는 곳이 안 보였다) */
</style>
<link rel="stylesheet" href="/desk.css?v=6ea590ec" media="(min-width:1024px)">
</head>
<body data-desk="read">

  <h1>찾으시는 페이지가 없네요</h1>

  <button class="cta sub" type="button" id="back" hidden onclick="history.back()">이전 페이지로</button>

</div></footer>
