name: 산출물 재생성 · main 이 바뀌면 생성물만 다시 굽는다 · 하실 일 없음

# 왜 있나(총괄 승인 2026-11-06). PR 은 생성 산출물을 싣지 않는다(CLAUDE.md) — 그 규칙 자체는 맞다. 대신
# 병합된 뒤 누군가 다시 굽기 전까지 `main` 의 커밋본이 코드와 어긋나 있는 창이 생기고, 그 창에 걸린
# 게이트가 발행과 데이터 배치를 막았다. 열흘에 세 번이다.
#   · 2026-10-30 #113 병합 뒤 — 공용 푸터 없는 페이지 24장·zone/서울 13px, 발행 런 40990048414
#   · 2026-11-05 #122 병합 뒤 — weekly·monthly 글자 하한, 단지 세션이 로컬에서 먼저 발견
#   · 2026-11-05 — 새 데이터로 원고 제목 자리표가 움직여 글 카드가 묵음, 배치 런 42053599155
# 전까지는 '원고가 올라오는 날'에만 다시 구워졌다(발행 워크플로의 트리거가 content/ 였다). 코드만 바뀐
# 병합에는 아무 일도 일어나지 않았다. 이 워크플로가 그 창을 '다음 main 푸시까지'로 줄인다.
#
# ⚠️ 굽는 일은 **발행 워크플로를 그대로 부른다**(workflow_call). 생성기 목록·커밋 대상·푸시 루프를 여기에
#    또 적지 않는다 — 같은 일을 두 곳에 적어 두면 한쪽만 고쳐져 어긋난다. 실제로 그렇게 어긋나 사고가
#    났다(2026-09-16 로컬 배치가 make_monthly_page 를 빠뜨림, 백로그 11).
# ⚠️ 숫자를 수집하지 않는다. 커밋된 data.js·tools/data/*.json 만 읽는다(키가 필요한 자리는 발행
#    워크플로에서 경고로 넘어간다). 산출물이 그대로면 커밋 없이 끝난다.
# ⚠️ 봇 커밋(GITHUB_TOKEN)은 워크플로를 다시 부르지 않는다 — 그래서 트리거에 paths 가 없어도 런이
#    스스로를 되풀어 돌지 않는다. PAT 로 푸시하면 그 보장이 깨진다(시험이 본다).

on:
  push:
    branches: [main]
    # 아래는 발행 워크플로가 **자기 트리거로 이미 반응하는** 경로다. 여기서 제외해야 같은 푸시에 두 런이
    # 같은 일을 하지 않는다(둘째 런은 '바뀐 것이 없다'로 끝나지만 러너를 7분 쓴다).
    # 이 목록은 발행 워크플로의 paths 와 **같아야** 한다 — test_batch_parity 가 글자로 대조한다.
    paths-ignore:
      - 'content/**'
      - 'tools/make_content_pages.py'
      - 'tools/content_tables.py'
      - 'tools/content_md.py'
      - 'tools/make_city_moveins.py'
      - 'tools/make_sido_pages.py'
      - 'tools/make_indicator_pages.py'
      - 'tools/make_monthly_page.py'
      - 'tools/make_weekly_page.py'
      - 'tools/make_home_summary.py'
      - 'tools/refresh_cycle_data.py'
      - 'tools/split_data.py'
      - 'tools/site_nav.py'
  workflow_dispatch:

# ⚠️ 여기에 concurrency 를 **두지 않는다.** 부르는 쪽과 불리는 쪽이 같은 그룹이면 GitHub 이 그 호출을
#    아예 거부한다 — 잡이 하나도 생기지 않고 'This run likely failed because of a workflow file issue'
#    로 끝난다(2026-11-06 첫 런 42210348489 이 그랬다. 그룹을 빼자 바로 돌았다 — 런 42212024087).
#    교착을 막는 검사로 보인다.
#    그래도 직렬화는 된다: 줄을 세우는 것은 **불리는 쪽**(publish-content.yml)의 그룹이다. 이 워크플로의
#    잡은 그 런이 끝날 때까지 기다리는 얇은 껍데기라 제 그룹이 필요 없다. 거부가 났다는 사실 자체가
#    GitHub 이 불리는 쪽 그룹을 센다는 증거다.
#    (둘이 동시에 돌면 같은 파일을 커밋해 rebase 가 충돌한다 — 2026-11-02 런 41459123576.)

permissions:
  contents: write

jobs:
  rebake:
    uses: ./.github/workflows/publish-content.yml
    secrets: inherit
