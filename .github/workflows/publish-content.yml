name: 원고 발행 · content/ 가 바뀌면 글 페이지를 굽는다

# 왜 매일 배치와 따로 있나. update-cloud.yml 은 데이터 수집용이라 하루 한 번 돈다. 원고는 세션들이 수시로
# 올리는데, 다음 배치까지 기다리면 글이 몇 시간 동안 주소 없이 저장소에만 있다(대표 결정 2026-10-26 ①
# '원고는 올리면 바로 발행'). 이 워크플로는 content/ 가 바뀐 푸시에만 돌고 **숫자를 수집하지 않는다** —
# 자리표는 저장소에 커밋된 data-*.js·tools/data/*.json 을 읽으므로 API 키가 필요 없다. 숫자를 새 데이터로
# 다시 채우는 일은 매일 배치가 한다(같은 생성기를 그쪽에서도 돌린다).
#
# ⚠️ 이 워크플로가 커밋하는 것은 /city/·/gtx/·/danji/·/column/·feed.xml·llms*.txt·sitemap.xml·index.html 이고
#    content/ 아래는 건드리지 않는다. 그래서 자기 커밋이 자기를 다시 부르지 않는다. 생성기가 원고를 고치게
#    되는 날이 오면 이 가정이 깨진다 — 그때는 paths-ignore 가 아니라 생성기를 고칠 일이다.

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      # 생성기와 자리표를 고쳐도 페이지를 다시 굽는다. 그러지 않으면 생성기만 바뀐 회차에 옛 페이지가
      # 남고, 그 뒤 누가 산출물을 손으로 커밋하면 그 사이 올라온 원고를 덮는다(2026-10-27 실제로 그랬다).
      - 'tools/make_content_pages.py'
      - 'tools/content_tables.py'
      - 'tools/content_md.py'
      - 'tools/make_city_moveins.py'
  workflow_dispatch:

concurrency:
  group: publish-content
  # 취소하지 않는다. 연달아 올라온 원고를 앞 런이 굽는 중에 취소해 버리면, 그 사이 글이 어느 런에서도
  # 구워지지 않고 끝날 수 있다(각 런은 자기 체크아웃 시점의 원고만 본다).
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # 푸시 루프가 rebase 한다

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 원고가 말하는 새 도시 받아 넣기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY || secrets.DATAGOKR }}
          KOSIS_API_KEY:  ${{ secrets.KOSIS_API_KEY || secrets.KOSIS }}
        run: |
          # 글이 말하는 도시가 tools/data/city_moveins.json 에 없으면 그 도시만 받는다. 이미 있는 도시의
          # 값은 건드리지 않는다 — 그 갱신은 매일 배치의 몫이다(원고 한 편 때문에 열세 도시를 다시 받지
          # 않고, 글이 올라온 날에 다른 글의 숫자가 따라 바뀌지도 않는다).
          # 검사보다 앞이다. 자료에 없는 도시를 자리표가 가리키면 검사가 먼저 걸려 발행이 멈춘다.
          # 키가 없거나 원천이 죽으면 그 글만 건너뛰어지고 나머지는 그대로 발행된다.
          timeout 600 python tools/make_city_moveins.py --fetch --new-only             || echo "::warning::새 도시 수집 실패 — 그 도시를 말하는 글은 이번 발행에서 건너뛴다"

      - name: 원고 검사
        run: |
          # 깨진 원고는 여기서 멈춘다(파일과 줄 번호로 알려 준다). 매일 배치는 깨진 글만 건너뛰고 계속
          # 가지만, 발행 워크플로는 올린 사람이 바로 고칠 수 있는 자리라 전수로 막는다.
          python tools/content_check.py

      - name: 페이지·피드·llms 생성
        run: |
          set -e
          python tools/make_content_pages.py
          python tools/make_feed.py
          python tools/make_llms_txt.py

      - name: 검증 게이트
        run: |
          # 커밋 앞에 둔다 — 깨진 산출물을 발행하지 않는다(매일 배치와 같은 순서).
          # pillow 도 깐다. 시험 네 묶음(공유 카드·썸네일·그림 도구·반올림)이 PIL 을 모듈 수준에서 들여오므로
          # 없으면 수집 단계에서 4 errors 로 끊긴다 — 첫 실행(40429921901)이 그래서 멈췄다.
          python -m pip install --quiet pytest pillow fonttools
          python -m pytest tools/tests/ -q

      - name: 글 공유 카드
        run: |
          # 게이트 뒤라 pillow 가 있다. 새 글의 카드를 굽고 같은 커밋에 싣는다 — 글이 올라온 그 회차부터
          # 카카오·트위터 미리보기에 제목 카드가 뜬다. 실패하면 섹션 공통 카드로 떨어지므로 멈추지 않는다.
          python tools/make_content_cards.py || echo "::warning::글 카드 생성 실패 — 섹션 공통 카드로 떨어진다"

      - name: 변경 있으면 커밋·푸시
        run: |
          set -e
          # zone(지역 묶음)·share(글 카드)가 빠져 있었다. 생성기가 고친 파일이 커밋 대상 밖에 남으면
          # pull --rebase 가 "You have unstaged changes" 로 거부해 발행이 통째로 유실된다(2026-10-29, 반박 4편).
          TARGETS="city gtx danji column reports zone share feed.xml llms.txt llms-full.txt sitemap.xml index.html tools/data/city_moveins.json"
          # 있는 경로만 센다 — 섹션 폴더는 그 섹션에 글이 생긴 날에 처음 나타난다.
          HAVE=""
          for p in $TARGETS; do [ -e "$p" ] && HAVE="$HAVE $p"; done
          if git diff --quiet -- $HAVE && git diff --cached --quiet -- $HAVE; then
            echo "바뀐 것이 없다 — 원고만 올렸고 페이지는 이미 같은 내용이다"
            exit 0
          fi
          # 그래도 대상 밖에 남은 것이 있으면 되돌린다 — 모두 생성기 산출물이라 다음 회차에 다시 나온다.
          # (남겨 두면 rebase 가 거부하고 이 회차 발행이 사라진다.)
          LEFT=$(git status --porcelain | grep -v '^??' || true)
          if [ -n "$LEFT" ]; then
            echo "::warning::커밋 대상 밖 변경을 되돌린다 — TARGETS 를 확인할 것:"; echo "$LEFT"
            git checkout -- . || true
          fi
          git config user.name  "stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- $HAVE
          git commit -m "원고 발행: 콘텐츠 페이지 재생성"
          # 매일 배치와 같은 푸시 루프. rebase 가 우리 커밋을 '이미 반영된 패치'로 버리면 HEAD 가 원격
          # 끝과 같아진다 — 그때 push 는 성공하지만 실은 커밋한 것이 없으므로 그렇게 적는다.
          pushed=0
          for i in 1 2 3; do
            PULLED=0
            git pull --rebase origin main && PULLED=1
            if [ "$PULLED" = 1 ] && [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
              echo "커밋 없음 — 같은 내용을 다른 런이 이미 발행했다(정상)"; pushed=2; break
            fi
            if [ "$PULLED" = 1 ] && git push; then
              echo "발행 완료"; pushed=1; break
            fi
            git rebase --abort 2>/dev/null || true
            echo "push 재시도 $i"; sleep 5
          done
          if [ "$pushed" -eq 0 ]; then
            WHO=$(git log -1 --format='%an' FETCH_HEAD 2>/dev/null || true)
            echo "::error::push 3회 모두 실패 — 이 발행이 유실된다(원격 끝 작성자: ${WHO:-모름}). 원고를 다시 올리거나 이 워크플로를 수동 실행할 것."
            exit 1
          fi
