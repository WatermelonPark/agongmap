name: 러너 판 시험 (ubuntu-26.04) · 실패해도 운영에는 영향 없음 · 하실 일 없음

# 왜 있나(2026-10-06 대표 결정): GitHub 이 ubuntu-latest 를 2026-10-19 부터 Ubuntu 26 으로 옮긴다.
# 배치·감시·시험이 판이 바뀌는 날 함께 깨지지 않도록 모든 워크플로의 runs-on 을 ubuntu-24.04 로 고정했고,
# 여기서 같은 시험(ci-tests.yml 의 gate·bare-runtime 두 잡)을 다음 판 러너에서 따로 돌려 본다.
# 이것이 몇 주 초록이면 고정 판을 올린다 — 모든 워크플로의 'ubuntu-24.04' 를 함께 바꾸고 이 파일의 판도 다음으로 옮긴다.
#
# ⚠️ 아무것도 커밋·푸시하지 않는다(ci-tests.yml 을 그대로 부른다 — 권한 읽기뿐).
# 실패하면 GitHub 실패 알림 메일이 온다. 그것은 '다음 판에서 깨질 것'의 예고일 뿐 운영 배치와는 무관하다.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/runner-trial.yml'
      - '.github/workflows/ci-tests.yml'
  # 주 1회 main 에서. 13:37 UTC 월요일 = 22:37 KST 월요일(ci-tests 매일 예약 22:17 KST 뒤).
  schedule:
    - cron: '37 13 * * 1'

permissions:
  contents: read

jobs:
  next-runner:
    uses: ./.github/workflows/ci-tests.yml
    with:
      runner: ubuntu-26.04
