name: 데이터 일회성 교정 (수동)

# 왜 있나: 키가 필요한 1회성 명령(--heal-annual·--heal-price, 등급 재현, 원천 표 탐색)은 정기 배치에 들어 있지 않아
# 지금까지 사람이 키 있는 환경에서 돌려 왔다. 저장소 시크릿은 이미 있으므로(Settings → Secrets and variables → Actions),
# Actions 수동 실행으로 **같은 시크릿을 써서** 돌린다 — 세션에 키를 넘길 필요가 없다.
#
# ⚠️ 이 워크플로는 main 에 데이터를 커밋할 수 있다(heal 두 작업). 그래서
#    ① 배치와 같은 순서로 생성기를 다시 굽고, ② GITHUB_ACTIONS=1 pytest 게이트를 통과한 뒤에만,
#    ③ 커밋 대상 화이트리스트에 없는 파일이 섞이면 멈춘다.
# ⚠️ 정기 배치(update-cloud)가 도는 시각과 겹치면 data.js push 가 경합한다 — 사람이 배치 로그를 보고 비는 시간에 돌린다.
#    (동시성 그룹을 update-cloud 와 합치지 않은 까닭: 배치가 40분 잡고 있을 때 heal 이 조용히 대기하는 것보다
#     바로 실패해 보이는 편이 낫다.)
on:
  workflow_dispatch:
    inputs:
      job:
        description: '할 일'
        required: true
        type: choice
        options:
          - heal-annual-보급률
          - heal-price
          - study-grade-bands
          - discover-규모별

permissions:
  contents: write       # heal 두 작업은 main 에 커밋·푸시한다

concurrency:
  group: data-heal
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 코드 받기 (배치와 같이 main 끝에서 시작)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 200

      - name: 파이썬 3.12 고정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 게이트 패키지 (배치와 같은 판)
        run: python3 -m pip install --quiet --upgrade pip pytest pillow

      - name: 작업 실행
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY || secrets.KOSIS }}
          RONE_API_KEY: ${{ secrets.RONE_API_KEY || secrets.RONE }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY || secrets.ECOS }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY || secrets.DATAGOKR }}
        run: |
          set -euo pipefail
          case "${{ inputs.job }}" in
            heal-annual-보급률)
              python3 tools/update_adv_data.py --heal-annual 보급률
              ;;
            heal-price)
              python3 tools/update_adv_data.py --heal-price 160 130
              ;;
            study-grade-bands)
              # 결과 JSON 은 저장소 밖(RUNNER_TEMP)에 쓴다 — 저장소에 쓰면 '보기 전용' 가드가 잡는다.
              python3 tools/study_grade_bands.py "$RUNNER_TEMP/grade_bands.json"
              ;;
            discover-규모별)
              python3 tools/update_adv_data.py --discover 주택규모별
              ;;
            *)
              echo "::error::모르는 작업이다: ${{ inputs.job }}"
              exit 1
              ;;
          esac

      - name: 보기 전용 작업은 저장소를 바꾸지 않았는지 확인
        if: inputs.job == 'study-grade-bands' || inputs.job == 'discover-규모별'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::보기 전용 작업인데 저장소 파일이 바뀌었다 — 생성기·도구가 파일을 쓰는지 확인할 것"
            git status --short
            exit 1
          fi
          echo "보기 전용 작업 — 저장소 변경 없음"

      - name: 등급 재현 결과 내려받기 (study-grade-bands)
        if: inputs.job == 'study-grade-bands'
        uses: actions/upload-artifact@v4
        with:
          name: grade-bands-json
          path: ${{ runner.temp }}/grade_bands.json
          if-no-files-found: warn

      - name: 게이트 (바뀐 경우만, 배치와 같은 순서)
        if: inputs.job == 'heal-annual-보급률' || inputs.job == 'heal-price'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY || secrets.DATAGOKR }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "바뀐 파일 없음 — 게이트를 건너뛴다"
            exit 0
          fi
          if ! python3 tools/make_city_moveins.py; then echo "::error::make_city_moveins 실패"; exit 1; fi
          if ! python3 tools/split_data.py; then echo "::error::split_data 실패"; exit 1; fi
          for g in make_sido_pages make_indicator_pages make_monthly_page make_weekly_page \
                   make_home_summary refresh_cycle_data make_content_pages make_feed make_llms_txt; do
            if ! python3 "tools/$g.py"; then echo "::error::$g 실패 — 커밋하지 않는다"; exit 1; fi
          done
          GITHUB_ACTIONS=1 python3 -m pytest tools/tests -q

      - name: 커밋·푸시 (바뀐 경우만)
        if: inputs.job == 'heal-annual-보급률' || inputs.job == 'heal-price'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "바뀐 파일 없음 — 커밋하지 않는다"
            exit 0
          fi
          git add -A
          git diff --cached --name-only > /tmp/heal_changed.txt
          BAD=$(grep -Ev '^(data\.js|data-core\.js|data-[^/]+\.json|index\.html|feed\.xml|llms\.txt|llms-full\.txt|sitemap\.xml|(zone|weekly|monthly|moveins|jeonse-ratio|cycle|city|gtx|danji|column|reports|share|tools/data)/)' /tmp/heal_changed.txt || true)
          if [ -n "$BAD" ]; then
            echo "::error::커밋 화이트리스트 밖 파일이 섞였다 — 커밋하지 않는다"
            echo "$BAD"
            exit 1
          fi
          cat /tmp/heal_changed.txt
          git config user.name "stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "데이터 일회성 교정: ${{ inputs.job }}"
          if ! git pull --rebase origin main; then
            echo "::error::main 이 앞서 rebase 가 충돌했다 — 사람이 확인해야 한다(자동으로 덮지 않는다)"
            git rebase --abort 2>/dev/null || true
            exit 1
          fi
          git push origin HEAD:main
